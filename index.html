<script>
// Multiplayer over Supabase Realtime presence. Fill in XY_CONFIG after creating a free Supabase project; empty = single-player.
window.XY_CONFIG={supabaseUrl:"",supabaseKey:""};
window.claude=window.claude||{use:async function(name){
  if(name!=="room")return null;const C=window.XY_CONFIG;if(!C.supabaseUrl||!C.supabaseKey)return null;
  if(!window.supabase){await new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";s.onload=res;s.onerror=rej;document.head.appendChild(s)}).catch(()=>null);if(!window.supabase)return null}
  const client=window.supabase.createClient(C.supabaseUrl,C.supabaseKey,{realtime:{params:{eventsPerSecond:12}}});
  const myId=Math.random().toString(36).slice(2,12);
  return{join:async function(roomName){
    const ch=client.channel("room:"+roomName,{config:{presence:{key:myId}}});let mine={};const hs=[];
    const emit=()=>{const st=ch.presenceState();const peers=[];for(const k in st){const p=st[k]&&st[k][0]||{};peers.push({peer:k,isMe:k===myId,sameTab:k===myId,kind:"viewer",presence:p})}if(!st[myId])peers.push({peer:myId,isMe:true,sameTab:true,kind:"viewer",presence:mine});hs.forEach(h=>{try{h({peers})}catch(e){}})};
    ch.on("presence",{event:"sync"},emit);
    await new Promise((res,rej)=>{const t=setTimeout(()=>rej(new Error("timeout")),12000);ch.subscribe(s=>{if(s==="SUBSCRIBED"){clearTimeout(t);res()}else if(s==="CHANNEL_ERROR"||s==="TIMED_OUT"){clearTimeout(t);rej(new Error(s))}})});
    let pending=null,last=0;const flush=async()=>{pending=null;last=Date.now();try{await ch.track(mine)}catch(e){}};
    return{presence:async function(p){mine=Object.assign({},mine,p);const wait=Math.max(0,120-(Date.now()-last));if(pending)return;pending=setTimeout(flush,wait)},
      onPeers:function(h){hs.push(h);setTimeout(emit,0);return()=>{const i=hs.indexOf(h);if(i>=0)hs.splice(i,1)}},
      leave:async function(){try{await ch.untrack();await client.removeChannel(ch)}catch(e){}}}}}}};

/* Layout: the sky owns the screen. Words and the action dock sit at the thumb, on a scrim that melts into the dark ground. */
:root{
  color-scheme:dark;
  --night:#060a14;
  --star:#edf1f7;
  --dust:#9aa7bb;
  --lamp:#f0c27a;
  --ink:#1b1712;
  --line:rgba(237,241,247,.2);
  --display:"ZCOOL XiaoWei","Noto Serif SC","Songti SC",serif;

html,body{height:100%;overflow:hidden;background:var(--night);color:var(--star);font-family:var(--sans);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:linear-gradient(#050814,#0e1626 70%,#17171a)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}
.layer{position:fixed;left:0;right:0;bottom:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-top:64px;background:linear-gradient(transparent,rgba(5,7,13,.76) 42%,rgba(5,7,13,.94));pointer-events:none}
.inner{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px;pointer-events:auto}
.logo{font-family:var(--display);font-size:64px;line-height:1;letter-spacing:.1em}
.tag{font-family:var(--serif);font-size:18px;line-height:1.7;text-wrap:balance}
.fine{font-size:13px;line-height:1.6;color:var(--dust)}
.btn{min-height:50px;border-radius:25px;padding:0 22px;font-weight:500;font-size:16px;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--lamp);color:var(--ink)}
.btn.ghost{border:1px solid var(--line);background:rgba(6,10,20,.4)}
.row{display:flex;gap:10px;align-items:stretch}.row>*{min-width:0}.grow{flex:1}
input.code,textarea{background:rgba(6,10,20,.55);border:1px solid var(--line);border-radius:18px;padding:12px 16px;font-size:16px;width:100%}
input.code{border-radius:25px;min-height:50px;padding:0 20px}

textarea{min-height:84px;resize:none;font-family:var(--serif);line-height:1.7}
.top{position:fixed;top:0;left:0;right:0;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none}
.top>*{pointer-events:auto}
.status{font-size:13px;line-height:1.5;text-shadow:0 1px 6px #000;min-width:0}
.status b{font-weight:500;display:block}.status span{color:var(--dust)}
.tools{display:flex;gap:8px;flex:none}
.chip{min-height:44px;min-width:44px;padding:0 13px;border-radius:22px;border:1px solid var(--line);background:rgba(6,10,20,.45);font-size:13px;display:flex;align-items:center;justify-content:center}
.eyebrow{font-size:13px;color:var(--lamp);letter-spacing:.05em}
.q{font-family:var(--serif);font-size:21px;line-height:1.55;text-wrap:pretty;animation:rise .8s ease both}
.q.small{font-size:17px}
@keyframes rise{from{opacity:.1;transform:translateY(8px)}to{opacity:1;transform:none}}
.links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.link{font-size:14px;color:var(--dust);min-height:40px;display:flex;align-items:center}
.dock{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:26px;background:rgba(10,14,24,.72);padding:4px}
.dock button{min-height:54px;border-radius:22px;font-size:14px;display:flex;align-items:center;justify-content:center;min-width:0}
.dock button[aria-pressed="true"]{background:var(--star);color:var(--ink)}
.dock.w4{grid-template-columns:repeat(4,1fr)}
.gifts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gifts button{min-height:56px;border:1px solid var(--line);border-radius:16px;font-size:14px;background:rgba(6,10,20,.4)}
.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;touch-action:none}
.keys button{height:82px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(rgba(240,194,122,.2),rgba(6,10,20,.5));font-size:12px;color:var(--dust);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
.keys button.on{background:var(--lamp);color:var(--ink)}
.tagname{position:fixed;left:0;top:0;font-size:12px;padding:3px 10px;border-radius:12px;background:rgba(6,10,20,.55);white-space:nowrap;pointer-events:none;will-change:transform}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-family:var(--serif);font-size:15px;text-shadow:0 1px 8px #000;white-space:nowrap;animation:fade 3.4s ease both;pointer-events:none}
@keyframes fade{0%,100%{opacity:0}15%,75%{opacity:1}}
.note .who{font-size:13px;color:var(--lamp);margin-bottom:2px}
.note p{margin:0;font-family:var(--serif);font-size:18px;line-height:1.6;overflow-wrap:anywhere}
@media (min-width:700px){.logo{font-size:84px}.q{font-size:26px}}
@media (prefers-reduced-motion:reduce){.q,.toast{animation-duration:.01s}}
.hallwrap{position:relative}
.hall .count{color:var(--dust);margin-left:6px;font-variant-numeric:tabular-nums}
.menu{position:absolute;top:50px;left:0;display:flex;flex-direction:column;background:rgba(10,14,24,.92);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:112px}
.menu button{min-height:44px;padding:0 16px;text-align:left;font-size:14px}
.menu button[aria-current]{color:var(--lamp)}
.hintline{font-size:13px;color:var(--star);text-align:center;text-shadow:0 1px 6px #000}
.off{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-size:12px;color:var(--dust);white-space:nowrap;text-shadow:0 1px 6px #000}
.tagname.mine{background:rgba(240,194,122,.85);color:var(--ink)}
.layer{padding-top:30px;background:linear-gradient(transparent,rgba(5,7,13,.55) 60%,rgba(5,7,13,.8))}
.dock{grid-template-columns:repeat(5,1fr)}
.mix{display:flex;flex-direction:column;gap:10px}.mix label{display:flex;align-items:center;gap:12px;font-size:14px}.mix label span{width:3em;color:var(--dust)}.mix input[type=range]{flex:1;accent-color:var(--lamp);min-height:32px}
.dock.d4{grid-template-columns:repeat(4,1fr)}.dock.d6{grid-template-columns:repeat(6,1fr)}.dock.d6 button{font-size:13px}
